<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · {{ app_nome }}</title><link rel="stylesheet" href="{{ url_for('static', filename='fonts/fonts.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='phosphor/regular/style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head>
<body class="login-page"><main class="login-card"><div class="login-brand"><span class="brand-mark"><i class="ph ph-chart-line-up"></i></span><div><strong>{{ app_nome }}</strong><small>Visão clara das suas finanças</small></div></div><h1>Bem-vindo de volta</h1><p>Entre para acompanhar os números da operação.</p>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="notice notice-{{ category }}" role="status">{{ message }}</div>{% endfor %}{% if error %}<div class="notice notice-error">{{ error }}</div>{% endif %}<form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>E-mail<input name="email" type="email" autocomplete="email" required value="{{ email or '' }}" placeholder="voce@empresa.com"></label><label>Senha<input name="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label><button class="btn btn-primary" type="submit">Entrar <i class="ph ph-arrow-right"></i></button></form><p class="login-hint">Acesso demonstrativo: teste@teste.com</p></main></body></html>
