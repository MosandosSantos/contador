<div class="field"><label for="conta_id">Código</label><input id="conta_id" name="conta_id" value="{{ edit.conta_id or '' }}" required {{ 'readonly' if edit }}></div>
<div class="field grow"><label for="descricao">Descrição</label><input id="descricao" name="descricao" value="{{ edit.descricao or '' }}" required></div>
<div class="field"><label for="grupo">Grupo patrimonial</label><select id="grupo" name="grupo">{% for k,t in [('pendente','Não classificado'),('ativo','Ativo'),('passivo','Passivo'),('pl','Patrimônio líquido'),('resultado','Resultado')] %}<option value="{{ k }}" {{ 'selected' if edit.grupo==k }}>{{ t }}</option>{% endfor %}</select></div>
<div class="field"><label for="classe_bp">Classificação no Balanço</label><select id="classe_bp" name="classe_bp">{% for k,t in [('pendente','A classificar'),('circulante','Circulante'),('nao_circulante','Não circulante'),('pl','Patrimônio líquido'),('resultado','Resultado')] %}<option value="{{ k }}" {{ 'selected' if edit.classe_bp==k }}>{{ t }}</option>{% endfor %}</select></div>
<div class="field"><label for="analitica">Tipo</label><select id="analitica" name="analitica"><option value="1" {{ 'selected' if edit.analitica!=false }}>Analítica · recebe lançamentos</option><option value="0" {{ 'selected' if edit.analitica==false }}>Sintética · agrupa contas</option></select></div>
<div class="field"><label for="pai">Conta pai</label><select id="pai" name="conta_pai_id"><option value="">Sem conta pai</option>{% for c in allcontas if not c.analitica and c.conta_id!=edit.conta_id %}<option value="{{ c.conta_id }}" {{ 'selected' if edit.conta_pai_id==c.conta_id }}>{{ c.conta_id }} · {{ c.descricao }}</option>{% endfor %}</select></div>
<div class="field"><label for="componente">Componente / função</label><select id="componente" name="componente">{% for k,t in componentes.items() %}<option value="{{ k }}" {{ 'selected' if edit.componente==k }}>{{ t }}</option>{% endfor %}</select></div>
<div class="field"><label for="linha_dre">Linha DRE de referência</label><select id="linha_dre" name="linha_dre">{% for k,t in linhas.items() %}<option value="{{ k }}" {{ 'selected' if edit.linha_dre==k }}>{{ t }}</option>{% endfor %}</select></div>
{% from 'linha_dre_cadastro.html' import destino with context %}
{{ destino('conta-dre-gerencial',edit.dre_destino or '',true,edit.dre_anteriores or []) }}
<div class="field"><label for="natureza">Natureza</label><select id="natureza" name="natureza"><option value="">Não informada</option><option value="devedora" {{ 'selected' if edit.natureza=='devedora' }}>Devedora</option><option value="credora" {{ 'selected' if edit.natureza=='credora' }}>Credora</option></select></div>
<div class="field"><label for="ordem">Ordem</label><input id="ordem" name="ordem" type="number" value="{{ edit.ordem or 100 }}" min="0" max="99999" required></div><div class="field"><label for="cod_referencial">Código referencial (SPED 0500)</label><input id="cod_referencial" name="cod_referencial" value="{{ edit.cod_referencial or '' }}" maxlength="60" placeholder="Código do plano referencial"></div><div class="field"><label for="nivel-calculado">Nível automático</label><output id="nivel-calculado" for="conta_id" class="account-level" aria-live="polite" title="Calculado pela estrutura do código">{{ edit.nivel or '—' }}</output></div>
