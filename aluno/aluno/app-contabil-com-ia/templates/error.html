<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title|default('Algo não saiu como esperado', true) }} · {{ app_nome }}</title><link rel="stylesheet" href="{{ url_for('static', filename='fonts/fonts.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='phosphor/regular/style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head><body class="login-page"><main class="login-card error-card"><i class="ph ph-warning-circle"></i><small class="muted">Erro {{ code|default('') }}</small><h1>{{ title|default('Algo não saiu como esperado', true) }}</h1><p>{{ message|default(error, true)|default('Tente novamente em alguns instantes.', true) }}</p><a class="btn btn-primary" href="/">Voltar ao início</a></main></body></html>
