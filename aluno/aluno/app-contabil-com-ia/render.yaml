services:
  - type: web
    name: app-contabil-com-ia
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: app-contabil-db
          property: connectionString

databases:
  - name: app-contabil-db
    databaseName: app_contabil
    plan: free
